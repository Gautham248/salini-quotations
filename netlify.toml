[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "pnpm prisma generate && pnpm build"

[build.environment]
  NODE_VERSION = "24"

[functions]
  included_files = ["dev.db"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
